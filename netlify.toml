[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "pg", "dotenv"]

# Keep the existing Express /api/* routes behind the serverless function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side app fallback. Keep this after the API rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
